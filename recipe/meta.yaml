{% set python_min = "3.12" %}
{% set name = "pywatershed" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pywatershed-{{ version }}.tar.gz
  sha256: 2f4521876b9d082a3886dbb889ea8c138bb316ccd4943a929587f1d6177ab406

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >64
    - numpy >=2.0
    - pip
  run:
    - python >={{ python_min }},<3.14
    - contextily
    # conda-forge package providing the epiweeks distribution
    - epiweeks4cf
    # flopy plus the contents of its pip "codegen" extra
    # (pywatershed requires flopy[codegen]; pip check enforces the
    # extra's dependencies)
    - flopy
    - boltons
    - jinja2 >=3.0
    - modflow-devtools >=1.7.0
    - tomli
    - tomli-w
    - geopandas
    - matplotlib-base >=1.4.0
    - netCDF4
    - networkx
    - numba
    - numpy >=2.0.0
    - pandas >=1.4.0
    - pint
    - pyprms
    - pyyaml
    - tqdm
    - xarray >=2023.5.0
    - xmltodict
    - xyzservices

test:
  imports:
    - pywatershed
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/DOI-USGS/pywatershed
  summary: pywatershed is a Python package for hydrologic modeling
  license: CC0-1.0
  license_file: LICENSE
  doc_url: https://pywatershed.readthedocs.io
  dev_url: https://github.com/DOI-USGS/pywatershed

extra:
  recipe-maintainers:
    - jmccreight
    - wpbonelli
