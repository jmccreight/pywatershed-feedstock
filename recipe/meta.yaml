{% set python_min = "3.12" %}
{% set name = "pywatershed" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pywatershed-{{ version }}.tar.gz
  sha256: 2f4521876b9d082a3886dbb889ea8c138bb316ccd4943a929587f1d6177ab406

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - importlib-metadata
    - numpy
    - twine
    - pip
  run:
    - boltons
    - cartopy
    - click !=8.1.0
    - dataretrieval
    - contextily
    - epiweeks4cf
    - filelock
    - flopy
    - folium
    - geopandas
    - geoviews
    - git
    - holoviews
    - hvplot
    - ipython
    - ipywidgets
    - jupyter
    - jupyter-black
    - jupyterlab
    - matplotlib >=1.4.0
    - nbconvert
    - netCDF4
    - networkx
    - numpy >=2.0.0
    - numba
    - modflow-devtools
    - pandas >=1.4.0
    - pint
    - pip
    - pre-commit
    - pydot
    - pytest !=8.1.0
    - pytest-cov
    - pytest-env
    - pytest-order
    - pytest-xdist
    - python >={{ python_min }},<3.14
    - pyyaml
    - ruff
    - shapely
    - sphinx
    - sphinx-book-theme >=0.3.3
    - sphinx-autodoc-typehints >=2.2.1
    - sphinx-autosummary-accessors
    - sphinx-copybutton
    - tqdm
    - xarray >=2024.06.0
    - xmltodict
    - xyzservices

test:
  imports:
    - pywatershed
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/EC-USGS/pywatershed
  summary: pywatershed is a Python package for hydrologic modeling
  license: CC0-1.0
  license_file: LICENSE
  doc_url: https://pywatershed.readthedocs.io
  dev_url: https://github.com/EC-USGS/pywatershed

extra:
  recipe-maintainers:
    - jmccreight
    - wpbonelli
